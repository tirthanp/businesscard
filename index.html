<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7E00B9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Tirthankar Pal - Digital Business Card</title>

    <!-- Open Graph / WhatsApp / iMessage / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tirthankar Pal - Digital Business Card">
    <meta property="og:description" content="Senior Principal Product Manager at Ribbon Communications">
    <meta property="og:image" content="https://yourdomain.com/tp-blog-author-headshot.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tirthankar Pal - Digital Business Card">
    <meta name="twitter:description" content="Senior Principal Product Manager at Ribbon Communications">
    <meta name="twitter:image" content="https://yourdomain.com/tp-blog-author-headshot.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7E00B9; /* Ribbon Purple */
            --accent-color: #E90575;  /* Ribbon Cranberry */
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --text-main: #4B4B4B;     /* Ribbon Grey */
            --text-muted: #666666;
            --border-color: #e9ecef;
            --linkedin-color: #0A66C2;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .mobile-app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .card-header {
            background: linear-gradient(to right, #7E00B9, #C0059E, #E90575, #FF007F) top / 100% 6px no-repeat, #ffffff;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .company-logo {
            height: 58px;
            max-width: 260px;
            object-fit: contain;
        }

        .hero-section {
            text-align: center;
            padding: 24px 20px 14px;
        }

        .profile-pic {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            background-color: var(--bg-color);
            box-shadow: 0 4px 14px rgba(75, 75, 75, 0.15);
            margin-bottom: 12px;
        }

        .name {
            margin: 0 0 4px;
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .designation {
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .designation-linkedin {
            color: var(--linkedin-color);
            font-size: 18px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: transform 0.15s ease;
        }

        .designation-linkedin:active {
            transform: scale(1.15);
        }

        .btn-save-vcard {
            margin: 0 20px 20px;
            padding: 15px 0;
            background: linear-gradient(135deg, #7E00B9 0%, #E90575 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(126, 0, 185, 0.25);
            text-decoration: none;
        }

        .btn-save-vcard:active {
            opacity: 0.9;
        }

        .contact-details {
            padding: 0 20px 20px;
            flex-grow: 1;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 10px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.15s ease;
        }

        .contact-item:active {
            background-color: #f8f9fa;
        }

        .contact-item i {
            color: var(--primary-color);
            font-size: 18px;
            width: 36px;
            flex-shrink: 0;
        }

        .contact-item span {
            word-break: break-word;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div class="mobile-app-container">
    <div class="card-header">
        <img src="rib_logo_hor_1_color_101-r-01.png" alt="Ribbon Communications Logo" class="company-logo">
    </div>

    <div class="hero-section">
        <img src="tp-blog-author-headshot.png" alt="Tirthankar Pal" class="profile-pic">
        <h1 class="name">Tirthankar Pal</h1>
        <div class="designation">
            <span>Senior Principal Product Manager</span>
            <a href="https://www.linkedin.com/in/tirthankarpal/" target="_blank" aria-label="LinkedIn Profile" class="designation-linkedin">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
    </div>

    <button class="btn-save-vcard" onclick="downloadVCard()">
        <i class="fas fa-user-plus"></i> Save to Contacts
    </button>

    <div class="contact-details">
        <a href="mailto:tpal@rbbn.com" class="contact-item">
            <i class="fas fa-envelope"></i>
            <span>tpal@rbbn.com</span>
        </a>
        <a href="tel:+19726921807" class="contact-item">
            <i class="fas fa-phone-alt"></i>
            <span>+1 (972) 692-1807</span>
        </a>
        <a href="https://maps.google.com/?q=6500+Chase+Oaks+Blvd,+Suite+100,+Plano,+TX+75023" target="_blank" class="contact-item">
            <i class="fas fa-location-dot"></i>
            <span>6500 Chase Oaks Blvd, Suite 100, Plano, TX 75023</span>
        </a>
        <a href="https://rbbn.com" target="_blank" class="contact-item">
            <i class="fas fa-globe"></i>
            <span>www.rbbn.com</span>
        </a>
    </div>
</div>

<script>
function downloadVCard() {
    const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Tirthankar Pal
TITLE:Senior Principal Product Manager
ORG:Ribbon Communications
EMAIL;TYPE=WORK:tpal@rbbn.com
TEL;TYPE=WORK:+19726921807
ADR;TYPE=WORK:;;6500 Chase Oaks Blvd\\, Suite 100;Plano;TX;75023;USA
URL:https://rbbn.com
URL;TYPE=LinkedIn:https://www.linkedin.com/in/tirthankarpal/
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Tirthankar_Pal.vcf';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
