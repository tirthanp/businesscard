<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card - Tirthankar Pal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #e9ecef;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .card-header {
            background-color: var(--primary-color);
            height: 100px;
            display: flex;
            justify-content: flex-end;
            padding: 15px;
            box-sizing: border-box;
        }

        .company-logo {
            height: 35px;
            max-width: 120px;
            object-fit: contain;
        }

        .profile-wrapper {
            margin-top: -50px;
            position: relative;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--card-bg);
            object-fit: cover;
            background-color: #dee2e6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-body {
            padding: 15px 30px 25px;
        }

        .name {
            margin: 10px 0 5px;
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
        }

        .designation {
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .contact-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .contact-list li {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .contact-list i {
            color: var(--primary-color);
            font-size: 18px;
            width: 24px;
            text-align: center;
            margin-right: 15px;
        }

        .contact-list a, .contact-list span {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
        }

        .contact-list a:hover {
            color: var(--accent-color);
        }

        .social-links {
            background-color: #f8f9fa;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid #e9ecef;
        }

        .social-links a {
            color: var(--primary-color);
            font-size: 22px;
            transition: color 0.2s, transform 0.2s;
        }

        .social-links a:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-header">
        <!-- Update the src attribute with the URL to your company logo -->
        <img src="https://via.placeholder.com/120x35?text=Company+Logo" alt="Company Logo" class="company-logo">
    </div>
    
    <div class="profile-wrapper">
        <!-- Update the src attribute with the URL to your profile picture -->
        <img src="https://via.placeholder.com/100?text=Profile" alt="Tirthankar Pal" class="profile-pic">
    </div>

    <div class="card-body">
        <h1 class="name">Tirthankar Pal</h1>
        <p class="designation">Senior Principal Product Manager</p>

        <ul class="contact-list">
            <li>
                <i class="fas fa-envelope"></i>
                <a href="mailto:your.email@example.com">your.email@example.com</a>
            </li>
            <li>
                <i class="fas fa-phone-alt"></i>
                <a href="tel:+1234567890">+1 (234) 567-8900</a>
            </li>
            <li>
                <i class="fas fa-globe"></i>
                <a href="https://www.companywebsite.com" target="_blank">www.companywebsite.com</a>
            </li>
        </ul>
    </div>
    
    <div class="social-links">
        <!-- Update the href attribute with your LinkedIn profile URL -->
        <a href="https://linkedin.com/in/yourprofile" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
        </a>
    </div>
</div>

</body>
</html>
