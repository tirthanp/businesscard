<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card - Tirthankar Pal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7E00B9; /* Ribbon Purple */
            --accent-color: #E90575;  /* Ribbon Cranberry */
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --text-main: #4B4B4B;     /* Ribbon Grey */
            --text-muted: #666666;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .card-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .card-header {
            background: linear-gradient(to right, #7E00B9, #C0059E, #E90575, #FF007F) top / 100% 6px no-repeat, #ffffff;
            height: 90px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            border-bottom: 1px solid #e9ecef;
        }

        .company-logo {
            height: 38px;
            max-width: 130px;
            object-fit: contain;
        }

        .profile-wrapper {
            margin-top: -45px;
            position: relative;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            background-color: #f4f4f6;
            box-shadow: 0 4px 12px rgba(75, 75, 75, 0.15);
        }

        .card-body {
            padding: 15px 30px 20px;
        }

        .name {
            margin: 10px 0 5px;
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
        }

        .designation {
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .btn-save {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 0;
            background: linear-gradient(135deg, #7E00B9 0%, #E90575 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(126, 0, 185, 0.25);
            transition: opacity 0.2s, transform 0.2s;
            margin-bottom: 25px;
        }

        .btn-save:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .contact-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .contact-list li {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .contact-list i {
            color: var(--primary-color);
            font-size: 18px;
            width: 24px;
            text-align: center;
            margin-right: 15px;
        }

        .contact-list a, .contact-list span {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
        }

        .contact-list a:hover {
            color: var(--accent-color);
        }

        .social-links {
            background-color: #f8f9fa;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid #e9ecef;
        }

        .social-links a {
            color: var(--primary-color);
            font-size: 22px;
            transition: color 0.2s, transform 0.2s;
        }

        .social-links a:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-header">
        <img src="https://ribboncommunications.com/sites/default/files/rib_logo_hor_1_color_101-r-01.png" alt="Ribbon Communications Logo" class="company-logo">
    </div>
    
    <div class="profile-wrapper">
        <img src="tp-blog-author-headshot.png" alt="Tirthankar Pal" class="profile-pic">
    </div>

    <div class="card-body">
        <h1 class="name">Tirthankar Pal</h1>
        <p class="designation">Senior Principal Product Manager</p>

        <button class="btn-save" onclick="downloadVCard()">
            <i class="fas fa-user-plus"></i> Save Contact
        </button>

        <ul class="contact-list">
            <li>
                <i class="fas fa-envelope"></i>
                <a href="mailto:tpal@rbbn.com">tpal@rbbn.com</a>
            </li>
            <li>
                <i class="fas fa-phone-alt"></i>
                <a href="tel:+19726921807">+1 (972) 692-1807</a>
            </li>
            <li>
                <i class="fas fa-globe"></i>
                <a href="https://rbbn.com" target="_blank">www.rbbn.com</a>
            </li>
        </ul>
    </div>
    
    <div class="social-links">
        <a href="https://www.linkedin.com/in/tirthankarpal/" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
        </a>
    </div>
</div>

<script>
function downloadVCard() {
    const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Tirthankar Pal
TITLE:Senior Principal Product Manager
ORG:Ribbon Communications
EMAIL;TYPE=WORK:tpal@rbbn.com
TEL;TYPE=WORK:+19726921807
URL:https://rbbn.com
URL;TYPE=LinkedIn:https://www.linkedin.com/in/tirthankarpal/
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Tirthankar_Pal.vcf';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
